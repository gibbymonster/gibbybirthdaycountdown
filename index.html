<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>countdown to gibby day</title>
  <link rel="icon" type="image/png" href="https://em-content.zobj.net/source/apple/126/birthday-cake_1f382.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <style>
    :root{
      --night:#12002a;
      --plum:#3a0a63;
      --pink:#ff2fa8;
      --orange:#ff9a3c;
      --yellow:#ffe66d;
      --cyan:#3df2ff;
      --ink:#fff4fb;
      --horizon:40%;
      --display:"Bungee", Impact, "Arial Black", sans-serif;
      --body:"Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive;
      cursor: url('https://cur.cursors-4u.net/cursors/cur-2/cur116.cur'), auto;
    }
    *{box-sizing:border-box;}
    html,body{height:100%; margin:0;}
    body{
      position:relative;
      overflow:hidden;
      font-family:var(--body);
      color:var(--ink);
      background:var(--night);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    /* ---------- scene (all CSS, no images to break) ---------- */
    .sky{
      position:absolute; inset:0 0 var(--horizon) 0;
      background:
        radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 28% 8%,  #fff 50%, transparent 51%),
        radial-gradient(2px 2px at 44% 22%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 63% 12%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 78% 26%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 90% 9%,  #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 6% 40%,  #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 93% 44%, #fff 50%, transparent 51%),
        linear-gradient(180deg, var(--night) 0%, var(--plum) 55%, #a3157a 85%, var(--pink) 100%);
    }
    .sun{
      position:absolute;
      left:50%;
      bottom:calc(var(--horizon) - 22vmin);
      width:44vmin; height:44vmin;
      transform:translateX(-50%);
      border-radius:50%;
      background:linear-gradient(180deg, var(--yellow) 10%, var(--orange) 45%, var(--pink) 90%);
      box-shadow:0 0 90px 10px rgba(255,47,168,.55);
      -webkit-mask-image:linear-gradient(to bottom,#000 52%,transparent 52% 57%,#000 57% 64%,transparent 64% 71%,#000 71% 79%,transparent 79% 88%,#000 88%);
              mask-image:linear-gradient(to bottom,#000 52%,transparent 52% 57%,#000 57% 64%,transparent 64% 71%,#000 71% 79%,transparent 79% 88%,#000 88%);
    }
    .floor{
      position:absolute; left:0; right:0; bottom:0; height:var(--horizon);
      background:var(--night);
      perspective:260px;
      overflow:hidden;
      border-top:2px solid var(--cyan);
      box-shadow:0 -6px 30px rgba(61,242,255,.45);
    }
    .grid{
      position:absolute; left:-60%; right:-60%; top:0; height:220%;
      transform-origin:50% 0;
      transform:rotateX(62deg);
      background-image:
        linear-gradient(rgba(255,47,168,.85) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255,47,168,.85) 2px, transparent 2px);
      background-size:70px 70px;
      animation:scroll 1.6s linear infinite;
    }
    @keyframes scroll{ to{ background-position:0 70px; } }
    .floor::after{ /* fade the grid into the horizon */
      content:""; position:absolute; inset:0;
      background:linear-gradient(180deg, var(--night) 0%, transparent 55%);
    }

    /* ---------- content ---------- */
    main{
      position:relative; z-index:2;
      display:flex; flex-direction:column; align-items:center;
      gap:clamp(18px,4vh,36px);
      text-align:center;
      margin-bottom:8vh;
    }
    h1{
      margin:0;
      font-family:var(--display);
      font-weight:400;
      font-size:clamp(26px,6vw,58px);
      line-height:1.05;
      color:var(--ink);
      text-shadow:0 0 12px var(--pink), 0 0 32px var(--pink), 3px 3px 0 #000;
    }
    h1 span{ color:var(--yellow); }

    .clock{
      display:flex; align-items:flex-start; justify-content:center;
      gap:clamp(6px,2vw,22px);
    }
    .unit{ display:flex; flex-direction:column; align-items:center; min-width:clamp(58px,15vw,150px); }
    .value{
      font-family:var(--display);
      font-size:clamp(44px,13vw,128px);
      line-height:1;
      color:#fff;
      text-shadow:0 0 10px var(--cyan), 0 0 34px var(--cyan), 4px 4px 0 rgba(0,0,0,.6);
      font-variant-numeric:tabular-nums;
    }
    .label{
      margin-top:6px;
      font-size:clamp(11px,2vw,15px);
      color:var(--yellow);
      letter-spacing:.14em;
    }
    .sep{
      font-family:var(--display);
      font-size:clamp(34px,10vw,100px);
      line-height:1.1;
      color:var(--pink);
      text-shadow:0 0 16px var(--pink);
      animation:blink 1s steps(2) infinite;
    }
    @keyframes blink{ 50%{ opacity:.25; } }

    .party{ display:none; }
    .party p{
      margin:0;
      font-family:var(--display);
      font-size:clamp(30px,8vw,84px);
      line-height:1.05;
      color:var(--yellow);
      text-shadow:0 0 14px var(--orange), 0 0 40px var(--pink), 4px 4px 0 #000;
      animation:wobble 1.2s ease-in-out infinite;
    }
    .party small{
      display:block; margin-top:14px;
      font-size:clamp(14px,2.5vw,20px);
      color:var(--cyan);
    }
    @keyframes wobble{
      0%,100%{ transform:rotate(-2deg) scale(1); }
      50%{ transform:rotate(2deg) scale(1.04); }
    }
    body.is-party .clock{ display:none; }
    body.is-party .party{ display:block; }
    body.is-party h1{ display:none; }

    .meta{
      position:absolute; z-index:2; left:0; right:0; bottom:14px;
      display:flex; justify-content:center; gap:8px 22px; flex-wrap:wrap;
      padding:0 16px;
      font-size:13px;
      color:var(--ink);
      text-shadow:0 1px 6px #000;
    }

    .confetti{ position:fixed; inset:0; z-index:3; pointer-events:none; overflow:hidden; }
    .confetti i{
      position:absolute; top:0;
      font-style:normal;
      opacity:0;
      animation:fall 2600ms linear forwards;
    }
    @keyframes fall{
      0%{ opacity:1; transform:translateY(-12vh) rotate(0deg); }
      100%{ opacity:1; transform:translateY(112vh) rotate(720deg); }
    }

    @media (prefers-reduced-motion: reduce){
      .grid,.sep,.party p,.confetti i{ animation:none; }
    }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="sun"></div>
  <div class="floor"><div class="grid"></div></div>

  <main>
    <h1 id="title">countdown to <span>gibby day</span></h1>

    <div class="clock" role="timer" aria-live="off">
      <div class="unit"><div class="value" id="days">0</div><div class="label">days</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="value" id="hours">00</div><div class="label">hours</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="value" id="minutes">00</div><div class="label">mins</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="value" id="seconds">00</div><div class="label">secs</div></div>
    </div>

    <div class="party" id="party">
      <p>happy birthday<br>gibby monster</p>
      <small>it's officially gibby day 🎂</small>
    </div>
  </main>

  <div class="meta">
    <span id="targetText">target: october 3</span>
    <span id="tzText"></span>
  </div>

  <div class="confetti" id="confetti"></div>

  <script>
    (function(){
      const daysEl = document.getElementById('days');
      const hoursEl = document.getElementById('hours');
      const minsEl = document.getElementById('minutes');
      const secsEl = document.getElementById('seconds');
      const confettiEl = document.getElementById('confetti');
      const targetText = document.getElementById('targetText');
      const tzText = document.getElementById('tzText');

      // add ?party to the url to preview the birthday screen
      const forceParty = new URLSearchParams(location.search).has('party');
      let celebrated = false;

      const pad = n => String(n).padStart(2, '0');

      function update(){
        const now = new Date();
        const year = now.getFullYear();
        const start = new Date(year, 9, 3);   // oct 3, 00:00 local
        const end   = new Date(year, 9, 4);   // oct 4, 00:00 local

        tzText.textContent = 'timezone: ' + (Intl.DateTimeFormat().resolvedOptions().timeZone || 'local clown zone');

        if (forceParty || (now >= start && now < end)){
          targetText.textContent = 'target: october 3, ' + year + ' (local gibbytime™)';
          document.body.classList.add('is-party');
          if (!celebrated){ celebrate(); celebrated = true; }
          return;
        }

        celebrated = false;
        document.body.classList.remove('is-party');
        confettiEl.innerHTML = '';

        const target = now < start ? start : new Date(year + 1, 9, 3);
        targetText.textContent = 'target: october 3, ' + target.getFullYear() + ' (local gibbytime™)';

        const total = Math.floor((target - now) / 1000);
        daysEl.textContent  = Math.floor(total / 86400);
        hoursEl.textContent = pad(Math.floor((total % 86400) / 3600));
        minsEl.textContent  = pad(Math.floor((total % 3600) / 60));
        secsEl.textContent  = pad(total % 60);
      }

      function celebrate(){
        confettiEl.innerHTML = '';
        const emojis = ['🤡','🎉','🪩','💥','🍕','🦑','🥳','🌈'];
        for (let i = 0; i < 40; i++){
          const el = document.createElement('i');
          el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          el.style.left = Math.random() * 100 + '%';
          el.style.animationDelay = Math.random() * 1.6 + 's';
          el.style.fontSize = (18 + Math.random() * 24) + 'px';
          confettiEl.appendChild(el);
        }
      }

      update();
      setInterval(update, 250);
    })();
  </script>
</body>
</html>
